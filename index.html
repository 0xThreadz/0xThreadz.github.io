<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il mio profilo · Links</title>
<meta name="description" content="Tutti i miei link in un posto solo.">
<meta name="theme-color" content="#07070d">
<style>
  :root {
    --bg: #07070d;
    --card: rgba(255, 255, 255, .045);
    --card-hover: rgba(255, 255, 255, .08);
    --border: rgba(255, 255, 255, .09);
    --text: #f2f2f8;
    --muted: #9a9ab0;
    --a1: #7c5cff;
    --a2: #19d3ff;
    --a3: #ff4fd8;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }

  /* ---------- sfondo ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; }
  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora i {
    position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%;
    filter: blur(90px); opacity: .32; mix-blend-mode: screen;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1) { background: var(--a1); top: -20vmax; left: -15vmax; }
  .aurora i:nth-child(2) { background: var(--a2); bottom: -25vmax; right: -15vmax; animation-delay: -7s; animation-duration: 28s; }
  .aurora i:nth-child(3) { background: var(--a3); top: 30%; left: 40%; width: 35vmax; height: 35vmax; opacity: .18; animation-delay: -13s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(8vmax, 5vmax) scale(1.2); }
  }
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    cursor: pointer;
  }
  #intro .half {
    position: absolute; left: 0; right: 0; height: 50.2%; background: #05050a;
    transition: transform 1.1s var(--ease);
  }
  #intro .top { top: 0; }
  #intro .bot { bottom: 0; }
  #intro.open .top { transform: translateY(-101%); }
  #intro.open .bot { transform: translateY(101%); }
  #intro .term {
    position: relative; z-index: 2; font: 500 clamp(14px, 3.4vw, 18px)/1.9 ui-monospace, "Cascadia Code", Consolas, monospace;
    color: #b9b9d6; min-width: min(86vw, 420px); transition: opacity .35s, transform .6s var(--ease);
  }
  #intro.open .term { opacity: 0; transform: scale(.94); }
  #intro .term .ok { color: #3de58b; }
  #intro .term .pr { color: var(--a2); }
  #intro .term .cur {
    display: inline-block; width: .55em; height: 1.05em; background: var(--a2);
    vertical-align: -.18em; margin-left: 2px; animation: blink 1s steps(1) infinite;
  }
  #intro .bar {
    position: relative; z-index: 2; margin-top: 18px; height: 3px; width: min(86vw, 420px);
    background: rgba(255, 255, 255, .08); border-radius: 3px; overflow: hidden;
    transition: opacity .3s;
  }
  #intro.open .bar { opacity: 0; }
  #intro .bar b {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3));
    box-shadow: 0 0 14px var(--a2);
  }
  #intro .skip {
    position: absolute; z-index: 2; bottom: 28px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: #5d5d78; letter-spacing: .12em; text-transform: uppercase;
  }
  .stack { position: relative; z-index: 2; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- layout ---------- */
  main {
    position: relative; z-index: 2; min-height: 100vh; display: grid; place-items: center;
    padding: 56px 16px 72px;
  }
  .wrap { width: 100%; max-width: 480px; perspective: 1000px; }

  .card {
    position: relative; padding: 34px 22px 26px; border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid var(--border);
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    transform-style: preserve-3d; transition: transform .25s var(--ease);
    text-align: center;
  }
  .card::before { /* bordo luminoso rotante */
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; z-index: -1;
    background: conic-gradient(from var(--ang, 0deg), transparent 0 60%, var(--a2), var(--a1), var(--a3), transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 6s linear infinite; opacity: .75;
  }
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --ang: 360deg; } }

  /* ---------- avatar ---------- */
  .avatar {
    position: relative; width: 118px; height: 118px; margin: 0 auto 18px;
    transform: translateZ(40px);
  }
  .avatar::before {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    background: conic-gradient(var(--a1), var(--a2), var(--a3), var(--a1));
    animation: rot 5s linear infinite; filter: blur(.3px);
  }
  .avatar::after {
    content: ""; position: absolute; inset: -18px; border-radius: 50%; z-index: -1;
    background: conic-gradient(var(--a1), var(--a2), var(--a3), var(--a1));
    filter: blur(26px); opacity: .45; animation: rot 5s linear infinite;
  }
  .avatar img, .avatar .ph {
    position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    border: 4px solid #0b0b14; background: #12121d; display: grid; place-items: center;
    font-size: 40px; font-weight: 700;
  }
  .status {
    position: absolute; z-index: 2; right: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 50%;
    background: #3de58b; border: 4px solid #0b0b14;
  }
  .status::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #3de58b;
    animation: ping 2s ease-out infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

  h1 {
    font-size: 28px; letter-spacing: -.02em; font-weight: 800; transform: translateZ(30px);
    background: linear-gradient(90deg, #fff, #c9c9ff 60%, var(--a2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    min-height: 1.3em;
  }
  .handle { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .role {
    margin-top: 10px; font: 500 14px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--a2);
    min-height: 1.4em;
  }
  .role .cur, h1 .cur {
    display: inline-block; width: 2px; height: 1em; background: currentColor;
    vertical-align: -.12em; margin-left: 3px; animation: blink 1s steps(1) infinite;
  }
  h1 .cur { -webkit-text-fill-color: var(--a2); background: var(--a2); }
  .bio { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin: 14px auto 0; max-width: 36ch; }

  /* ---------- statistiche GitHub ---------- */
  .stats {
    display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px;
  }
  .stats.on { display: grid; }
  .stat {
    padding: 12px 6px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--border);
  }
  .stat b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ---------- link ---------- */
  .links { display: grid; gap: 11px; margin-top: 24px; }
  .link {
    --mx: 50%; --my: 50%;
    position: relative; display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 14px 16px; border-radius: 18px; color: inherit; text-decoration: none; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    transition: transform .35s var(--ease), background .3s, border-color .3s, box-shadow .35s;
  }
  .link::before { /* riflettore che segue il mouse */
    content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .3s;
    background: radial-gradient(220px circle at var(--mx) var(--my), rgba(124, 92, 255, .28), transparent 70%);
  }
  .link:hover, .link:focus-visible {
    transform: translateY(-3px) scale(1.015); border-color: rgba(255,255,255,.22);
    background: var(--card-hover); box-shadow: 0 14px 34px -12px rgba(124, 92, 255, .55); outline: none;
  }
  .link:hover::before, .link:focus-visible::before { opacity: 1; }
  .link:active { transform: scale(.985); }
  .ico {
    position: relative; flex: none; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--c1, var(--a1)), var(--c2, var(--a2)));
    box-shadow: 0 8px 20px -8px var(--c1, var(--a1));
    transition: transform .4s var(--ease);
  }
  .link:hover .ico { transform: rotate(-8deg) scale(1.08); }
  .ico svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .txt { position: relative; flex: 1; min-width: 0; }
  .txt strong { display: block; font-size: 15.5px; font-weight: 650; }
  .txt small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arrow { position: relative; flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--ease), stroke .3s; }
  .link:hover .arrow { transform: translateX(4px); stroke: #fff; }
  .link .shine {
    position: absolute; top: 0; bottom: 0; width: 60px; left: -80px; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  }
  .link:hover .shine { animation: shine .8s var(--ease); }
  @keyframes shine { to { left: calc(100% + 40px); } }

  /* ---------- repo ---------- */
  .section-title {
    margin: 30px 0 12px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 12px;
  }
  .section-title::before, .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .repos { display: grid; gap: 10px; }
  .repo {
    display: block; text-align: left; padding: 13px 15px; border-radius: 16px; color: inherit; text-decoration: none;
    background: var(--card); border: 1px solid var(--border); transition: transform .3s var(--ease), border-color .3s, background .3s;
  }
  .repo:hover { transform: translateY(-2px); border-color: rgba(25, 211, 255, .5); background: var(--card-hover); }
  .repo b { font-size: 14.5px; }
  .repo p { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
  .repo .meta { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .repo .meta i { font-style: normal; color: var(--a2); }
  #repos-sec { display: none; }
  #repos-sec.on { display: block; }

  footer { margin-top: 28px; font-size: 12px; color: #5f5f78; }
  footer a { color: inherit; }

  /* ---------- animazioni d'ingresso ---------- */
  .reveal { opacity: 0; transform: translateY(26px) scale(.97); filter: blur(6px); }
  body.ready .reveal {
    animation: rise .9s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 85ms + .15s);
  }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }
  .card { opacity: 0; transform: scale(.92) translateY(40px); }
  body.ready .card { animation: cardIn 1.1s var(--ease) forwards; }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  body.ready .card.tilting { animation: none; opacity: 1; transform: none; }

  @media (max-width: 380px) { .card { padding: 28px 14px 22px; } h1 { font-size: 24px; } }
</style>
</head>
<body class="locked">

<canvas id="bg"></canvas>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grain"></div>

<!-- INTRO -->
<div id="intro" role="presentation">
  <div class="half top"></div>
  <div class="half bot"></div>
  <div class="stack">
    <div class="term" id="term"></div>
    <div class="bar"><b id="bar"></b></div>
  </div>
  <div class="skip">clicca per saltare</div>
</div>

<main>
  <div class="wrap">
    <section class="card" id="card">
      <div class="avatar reveal" style="--i:0">
        <img id="avatar" alt="Foto profilo">
        <span class="status" title="Online"></span>
      </div>
      <h1 id="name"></h1>
      <div class="handle reveal" id="handle" style="--i:3"></div>
      <div class="role reveal" style="--i:4"><span id="role"></span><span class="cur"></span></div>
      <p class="bio reveal" id="bio" style="--i:5"></p>

      <div class="stats reveal" id="stats" style="--i:6">
        <div class="stat"><b data-k="public_repos">0</b><span>Repo</span></div>
        <div class="stat"><b data-k="followers">0</b><span>Follower</span></div>
        <div class="stat"><b data-k="stars">0</b><span>Stelle</span></div>
      </div>

      <nav class="links" id="links" aria-label="Link"></nav>

      <div id="repos-sec">
        <div class="section-title reveal" style="--i:12">Progetti in evidenza</div>
        <div class="repos" id="repos"></div>
      </div>

      <footer class="reveal" style="--i:14">
        © <span id="year"></span> · fatto con <span style="color:#ff4f7b">♥</span> su <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>
      </footer>
    </section>
  </div>
</main>

<script>
/* =====================================================
   ✏️  CONFIGURAZIONE — modifica solo questa parte
   ===================================================== */
const CONFIG = {
  username: "0xThreadz",             // il tuo username GitHub (foto + statistiche + repo)
  name: "0xThread",
  bio: "Smanettone, tool e reverse engineering. Qui trovi tutti i miei link.",
  roles: ["Developer", "Reverse Engineer", "Tinkerer", "Open Source Fan"],
  avatar: "",                        // lascia vuoto per usare la foto GitHub, oppure metti un URL/percorso
  showGithubStats: true,             // contatori Repo / Follower / Stelle
  showTopRepos: 3,                   // quante repo in evidenza mostrare (0 = nessuna)
  links: [
    { label: "GitHub", desc: "Codice e progetti", url: "https://github.com/0xThreadz", icon: "github", c1: "#8b5cf6", c2: "#4c1d95" }
    // Esempi da aggiungere (ricordati la virgola dopo il link precedente):
    // { label: "Telegram",  desc: "Scrivimi",   url: "https://t.me/tuo_username",         icon: "send",      c1: "#29b6f6", c2: "#0277bd" },
    // { label: "Instagram", desc: "@tuo_user",  url: "https://instagram.com/tuo_user",    icon: "instagram", c1: "#ff4fd8", c2: "#ff9a3c" },
    // { label: "YouTube",   desc: "Video",      url: "https://youtube.com/@tuo_canale",   icon: "youtube",   c1: "#ff3d3d", c2: "#b30000" },
    // { label: "Email",     desc: "me@mail.it", url: "mailto:me@mail.it",                 icon: "mail",      c1: "#19d3ff", c2: "#0ea5a5" }
  ]
};

/* ---------- icone (stile Feather) ---------- */
const ICONS = {
  github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
  mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
  globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  instagram: '<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
  youtube: '<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>',
  twitter: '<path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>',
  send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'
};
const ARROW = '<svg class="arrow" viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>';

const $ = (s) => document.querySelector(s);
// Le animazioni restano sempre attive: molti PC Windows hanno "animazioni di sistema" disattivate
// senza saperlo, e rispettare quell'impostazione toglieva intro ed effetti.
const reduced = false;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---------- contenuti ---------- */
document.title = CONFIG.name + " · Links";
$("#year").textContent = new Date().getFullYear();
$("#bio").textContent = CONFIG.bio;
$("#handle").textContent = "@" + CONFIG.username;

const av = $("#avatar");
av.src = CONFIG.avatar || `https://github.com/${CONFIG.username}.png?size=240`;
av.onerror = () => {
  const ph = document.createElement("div");
  ph.className = "ph"; ph.textContent = CONFIG.name.trim().charAt(0).toUpperCase();
  av.replaceWith(ph);
};

$("#links").innerHTML = CONFIG.links.map((l, i) => `
  <a class="link reveal" style="--i:${i + 7};--c1:${esc(l.c1 || "#7c5cff")};--c2:${esc(l.c2 || "#19d3ff")}"
     href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
    <span class="shine"></span>
    <span class="ico"><svg viewBox="0 0 24 24">${ICONS[l.icon] || ICONS.link}</svg></span>
    <span class="txt"><strong>${esc(l.label)}</strong><small>${esc(l.desc || "")}</small></span>
    ${ARROW}
  </a>`).join("");

document.querySelectorAll(".link").forEach(el => {
  el.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", (e.clientX - r.left) + "px");
    el.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
});

/* ---------- sfondo particellare ---------- */
(function particles() {
  const cv = $("#bg"), ctx = cv.getContext("2d");
  let W, H, dpr, pts = [];
  const mouse = { x: -999, y: -999 };
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    const n = Math.min(110, Math.floor(innerWidth * innerHeight / 14000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35 * dpr, vy: (Math.random() - .5) * .35 * dpr,
      r: (Math.random() * 1.4 + .6) * dpr
    }));
  }
  addEventListener("resize", resize);
  addEventListener("pointermove", e => { mouse.x = e.clientX * dpr; mouse.y = e.clientY * dpr; });
  addEventListener("pointerleave", () => { mouse.x = mouse.y = -999; });
  resize();
  const LINK = 130 * (devicePixelRatio > 1 ? 1.5 : 1);
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < 160 * dpr) { p.vx += dx / d * .02; p.vy += dy / d * .02; }
      p.vx *= .995; p.vy *= .995;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.fillStyle = "rgba(190,200,255,.7)"; ctx.fill();
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < LINK) {
        ctx.strokeStyle = `rgba(124,140,255,${(1 - d / LINK) * .28})`;
        ctx.lineWidth = dpr * .8;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    // collegamenti col mouse
    for (const p of pts) {
      const d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (d < 180 * dpr) {
        ctx.strokeStyle = `rgba(25,211,255,${(1 - d / (180 * dpr)) * .55})`;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    if (!reduced) requestAnimationFrame(frame);
  }
  frame();
})();

/* ---------- intro "terminale" ---------- */
async function typeInto(el, text, speed = 28) {
  for (const ch of text) { el.textContent += ch; await sleep(speed + Math.random() * 20); }
}

let introDone = false;
async function runIntro() {
  const intro = $("#intro"), term = $("#term"), bar = $("#bar");
  const finish = async () => {
    if (introDone) return; introDone = true;
    intro.classList.add("open");
    document.body.classList.add("ready");
    await sleep(1150);
    intro.remove();
    document.body.classList.remove("locked");
    startHero();
  };
  intro.addEventListener("click", finish);
  addEventListener("keydown", finish, { once: true });
  if (reduced) { finish(); return; }

  const lines = [
    ["pr", "$ ", `ssh ${CONFIG.username}@github.io`],
    ["ok", "✔ ", "connessione stabilita"],
    ["ok", "✔ ", "carico il profilo…"],
    ["pr", "> ", "benvenuto."]
  ];
  let pct = 0;
  const tick = setInterval(() => { pct = Math.min(100, pct + 1.6); bar.style.width = pct + "%"; }, 40);
  for (const [cls, pre, text] of lines) {
    if (introDone) break;
    const row = document.createElement("div");
    row.innerHTML = `<span class="${cls}">${pre}</span><span class="t"></span><span class="cur"></span>`;
    term.querySelectorAll(".cur").forEach(c => c.remove());
    term.appendChild(row);
    row.insertAdjacentHTML("beforeend", "");
    const cur = row.querySelector(".cur");
    await typeInto(row.querySelector(".t"), text, cls === "pr" ? 38 : 16);
    if (!introDone) await sleep(220);
    if (cls !== "pr" || text !== "benvenuto.") cur.remove();
  }
  clearInterval(tick); bar.style.width = "100%";
  await sleep(450);
  finish();
}

/* ---------- hero: nome + ruoli che si scrivono ---------- */
async function startHero() {
  const h1 = $("#name"), role = $("#role");
  h1.textContent = "";
  const cur = document.createElement("span"); cur.className = "cur";
  h1.append(document.createTextNode(""), cur);
  if (reduced) { h1.firstChild.textContent = CONFIG.name; cur.remove(); }
  else {
    for (const ch of CONFIG.name) { h1.firstChild.textContent += ch; await sleep(60); }
    await sleep(500); cur.remove();
  }
  if (reduced) { role.textContent = CONFIG.roles[0]; return; }
  let i = 0;
  while (true) {
    const word = CONFIG.roles[i++ % CONFIG.roles.length];
    for (let k = 1; k <= word.length; k++) { role.textContent = word.slice(0, k); await sleep(70); }
    await sleep(1500);
    for (let k = word.length; k >= 0; k--) { role.textContent = word.slice(0, k); await sleep(35); }
    await sleep(250);
  }
}

/* ---------- tilt 3D della card ---------- */
(function tilt() {
  const card = $("#card");
  if (reduced || matchMedia("(pointer: coarse)").matches) return;
  card.addEventListener("animationend", () => card.classList.add("tilting"), { once: true });
  addEventListener("pointermove", e => {
    if (!card.classList.contains("tilting")) return;
    const x = (e.clientX / innerWidth - .5), y = (e.clientY / innerHeight - .5);
    card.style.transform = `rotateY(${x * 7}deg) rotateX(${-y * 7}deg)`;
  });
  addEventListener("pointerleave", () => { card.style.transform = ""; });
})();

/* ---------- dati GitHub (contatori + repo) ---------- */
function countUp(el, to) {
  if (reduced) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 1400;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    el.textContent = Math.round(to * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

async function loadGithub() {
  if (!CONFIG.showGithubStats && !CONFIG.showTopRepos) return;
  try {
    const [uRes, rRes] = await Promise.all([
      fetch(`https://api.github.com/users/${CONFIG.username}`),
      fetch(`https://api.github.com/users/${CONFIG.username}/repos?per_page=100&sort=updated`)
    ]);
    if (!uRes.ok || !rRes.ok) throw new Error("api");
    const user = await uRes.json(), repos = await rRes.json();
    const own = repos.filter(r => !r.fork);

    if (CONFIG.showGithubStats) {
      const stars = own.reduce((s, r) => s + r.stargazers_count, 0);
      $("#stats").classList.add("on");
      const vals = { public_repos: user.public_repos, followers: user.followers, stars };
      // parte il conteggio quando l'intro è finita
      const wait = setInterval(() => {
        if (!document.body.classList.contains("ready")) return;
        clearInterval(wait);
        setTimeout(() => document.querySelectorAll("[data-k]").forEach(b => countUp(b, vals[b.dataset.k])), 900);
      }, 100);
    }

    if (CONFIG.showTopRepos > 0 && own.length) {
      const top = own.sort((a, b) => b.stargazers_count - a.stargazers_count || new Date(b.pushed_at) - new Date(a.pushed_at))
                     .slice(0, CONFIG.showTopRepos);
      $("#repos").innerHTML = top.map((r, i) => `
        <a class="repo reveal" style="--i:${13 + i}" href="${esc(r.html_url)}" target="_blank" rel="noopener noreferrer">
          <b>${esc(r.name)}</b>
          ${r.description ? `<p>${esc(r.description)}</p>` : ""}
          <div class="meta">
            ${r.language ? `<span><i>●</i> ${esc(r.language)}</span>` : ""}
            <span>★ ${r.stargazers_count}</span>
            <span>⑂ ${r.forks_count}</span>
          </div>
        </a>`).join("");
      $("#repos-sec").classList.add("on");
    }
  } catch (_) { /* offline o rate-limit: la pagina funziona lo stesso */ }
}

runIntro();
loadGithub();
</script>
